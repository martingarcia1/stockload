server {
    listen 80;
    server_name _;

    # Fotos de productos (Cloudinary) pasan por la API
    client_max_body_size 20m;

    # La API se sirve por el mismo puerto que la web: así funciona igual desde
    # localhost, desde otra PC de la red o a través de un túnel (un solo link).
    # DNS interno de Docker: se vuelve a resolver "api" cada 10 s, así un reinicio
    # de la API (que puede cambiar su IP interna) no deja a nginx apuntando a la IP vieja (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Esto es vital para React Router (Single Page Applications)
        # Si no encuentra el archivo estático (ej /inventario), redirige a index.html
        try_files $uri $uri/ /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
